<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memory Game – Two Players</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <!-- Header -->
  <header class="site-header">
    <h1>Memory Game – Two Players</h1>
    <p class="tagline">Test your memory and compete with a friend!</p>
  </header>

<!-- Main Content -->
<main class="site-main">

    <!-- CONTROLS (RESTART + RESET ALL + STATUS MESSAGE) -->
    <section class="controls" aria-label="Game controls">
      <div class="controls-buttons">
        <button id="restart-button" type="button">Restart Round</button>
        <button id="reset-all-button" type="button">Reset All</button>
      </div>
      <p id="status-message" aria-live="polite">
        Player 1, it’s your turn. Flip two cards!
      </p>
    </section>

    <!-- GAME LAYOUT: PLAYER 1 | BOARD | PLAYER 2 -->
    <section class="game-layout" aria-label="Game layout">

      <!-- PLAYER 1 PANEL -->
      <aside class="player-panel player-panel--left player-panel--active" id="player-1-panel">
        <h2>Player 1</h2>

        <label for="player-1-name" class="player-name-label">Enter your name:</label>
        <input
          type="text"
          id="player-1-name"
          class="player-name-input"
          placeholder="Player 1 Name">

        <div class="score-box">
          <p>Round Score: <span id="player-1-score">0</span></p>
          <p>Total Matches Won: <span id="player-1-total-wins">0</span></p>
        </div>
      </aside>

      <!-- GAME BOARD (CARDS GRID) -->
      <section class="game-board" aria-label="Memory game board">
        <div class="cards-grid" id="cards-grid">
        </div>
      </section>

      


</main>

<!-- Footer -->
  <footer class="site-footer">
    <p>&copy; 2025 Memory Game – Two Players</p>
  </footer>

  <!-- JavaScript -->
  <script src="assets/js/script.js"></script>
</body>
</html>
